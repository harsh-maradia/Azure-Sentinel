id: 44c51bc8-1c06-46ca-ba25-0422d0af4015
Function:
  Title: Parser for BitSightIndustrialStatistics
  Version: '1.2.0'
  LastUpdated: '2026-11-02'
Category: Microsoft Sentinel Parser
FunctionName: BitSightIndustrialStatistics
FunctionAlias: BitSightIndustrialStatistics
FunctionQuery: |
    let LocalData = (
        BitsightIndustrial_statistics_CL
        | extend
                    EventVendor = "BitSight",
                    EventProduct = "IndustrialStatistics",
                    Count = todouble(column_ifexists('count', '')),
                    CountPeriod = tostring(column_ifexists('count_period', '')),
                    AverageDurationDays = todouble(column_ifexists('average_duration_days', '')),
                    RiskVector = tostring(column_ifexists('risk_vector', '')),
                    CompanyName = tostring(column_ifexists('Company_name', ''))
        | project
                    TimeGenerated,
                    EventVendor,
                    EventProduct,
                    Count,
                    CountPeriod,
                    AverageDurationDays,
                    RiskVector,
                    CompanyName
    );
    union isfuzzy=true
        (
            LocalData
        ),
        (
            // 3.0.x classic table in the old workspace (HTTP Data Collector API, suffixed columns)
            workspace('413d4385-18c4-4f38-bfa4-266196b82b38').BitsightIndustrial_statistics_CL
            | extend
                    EventVendor = "BitSight",
                    EventProduct = "IndustrialStatistics",
                    Count = todouble(column_ifexists('count_d','')),
                    CountPeriod = tostring(column_ifexists('count_period_s','')),
                    AverageDurationDays = todouble(column_ifexists('average_duration_days_d','')),
                    RiskVector = tostring(column_ifexists('risk_vector_s','')),
                    CompanyName = tostring(column_ifexists('Company_name_s',''))
            | where strcat(CompanyName,'|',RiskVector,'|',CountPeriod) !in (toscalar(LocalData | summarize make_set(strcat(CompanyName,'|',RiskVector,'|',CountPeriod))))
            | project
                    TimeGenerated,
                    EventVendor,
                    EventProduct,
                    Count,
                    CountPeriod,
                    AverageDurationDays,
                    RiskVector,
                    CompanyName
        ),
        (
            BitsightIndustrialStatistics_CL
            | extend
                    EventVendor = "BitSight",
                    EventProduct = "IndustrialStatistics"
            | project
                    TimeGenerated,
                    EventVendor,
                    EventProduct,
                    CompanyName,
                    CompanyGuid,
                    RiskVector,
                    IncidentCount,
                    CountPeriod,
                    AverageDurationDays,
                    ConnectorName
        )