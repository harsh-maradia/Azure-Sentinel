id: a1d7d1c7-5677-4abe-a717-60cdf261e0c7
Function:
  Title: Parser for BitSightDiligenceHistoricalStatistics
  Version: '1.2.0'
  LastUpdated: '2026-11-02'
Category: Microsoft Sentinel Parser
FunctionName: BitSightDiligenceHistoricalStatistics
FunctionAlias: BitSightDiligenceHistoricalStatistics
FunctionQuery: |
    let LocalData = (
        BitsightDiligence_historical_statistics_CL
        | extend
                    EventVendor = "BitSight",
                    EventProduct = "DiligenceHistoricalStatistics",
                    Count = todouble(column_ifexists('count', '')),
                    Category = tostring(column_ifexists('category', '')),
                    Date = todatetime(column_ifexists('parsed_date', '')),
                    CompanyName = tostring(column_ifexists('company_name', '')),
                    Grade = tostring(column_ifexists('grade', ''))
        | project
                    TimeGenerated,
                    EventVendor,
                    EventProduct,
                    Count,
                    Category,
                    Date,
                    CompanyName,
                    Grade
    );
    union isfuzzy=true
        (
            LocalData
        ),
        (
            // 3.0.x classic table in the old workspace (HTTP Data Collector API, suffixed columns)
            workspace('413d4385-18c4-4f38-bfa4-266196b82b38').BitsightDiligence_historical_statistics_CL
            | extend
                    EventVendor = "BitSight",
                    EventProduct = "DiligenceHistoricalStatistics",
                    Count = todouble(column_ifexists('count_d','')),
                    Category = tostring(column_ifexists('Category','')),
                    Date = todatetime(column_ifexists('date_s','')),
                    CompanyName = tostring(column_ifexists('company_name_s','')),
                    Grade = tostring(column_ifexists('grade_s',''))
            | where strcat(CompanyName,'|',Category,'|',tostring(Date)) !in (toscalar(LocalData | summarize make_set(strcat(CompanyName,'|',Category,'|',tostring(Date)))))
            | project
                    TimeGenerated,
                    EventVendor,
                    EventProduct,
                    Count,
                    Category,
                    Date,
                    CompanyName,
                    Grade
        ),
        (
            BitSightDiligenceHistoricalStatistics_CL
            | summarize arg_max(TimeGenerated, *) by CompanyGuid, RecordDate
            | mv-expand CountEntry = Counts
            | extend
                    EventVendor = "BitSight",
                    EventProduct = "DiligenceHistoricalStatistics",
                    Count = toint(CountEntry["count"]),
                    Category = tostring(CountEntry["category"])
            | project
                    TimeGenerated,
                    EventVendor,
                    EventProduct,
                    CompanyName,
                    CompanyGuid,
                    RecordDate,
                    Grade,
                    Count,
                    Category,
                    ConnectorName
        )