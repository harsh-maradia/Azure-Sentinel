id: 43e914e1-3b7b-4824-bb16-90e5dedad176
Function:
  Title: Parser for BitSightBreaches
  Version: '1.2.0'
  LastUpdated: '2026-11-02'
Category: Microsoft Sentinel Parser
FunctionName: BitSightBreaches
FunctionAlias: BitSightBreaches
FunctionQuery: |
    let LocalData = (
        BitsightBreaches_data_CL
        | extend
                    EventVendor = "BitSight",
                    EventProduct = "Breaches",
                    GUID = tostring(column_ifexists('guid', '')),
                    Date = todatetime(column_ifexists('parsed_date', '')),
                    Severity = todouble(column_ifexists('severity', '')),
                    Text = tostring(column_ifexists('text', '')),
                    DateCreated = todatetime(column_ifexists('date_created', '')),
                    PreviwURL = tostring(column_ifexists('preview_url', '')),
                    EventType = tostring(column_ifexists('event_type', '')),
                    EventTypeDescription = tostring(column_ifexists('event_type_description', '')),
                    BreachedCompanies = todynamic(column_ifexists('breached_companies', '')),
                    DependentCompanies = todynamic(column_ifexists('dependent_companies', '')),
                    Companyname = tostring(column_ifexists('company_name', '')),
                    CompanyGUID = tostring(column_ifexists('company_guid', ''))
        | project
                    TimeGenerated,
                    EventVendor,
                    EventProduct,
                    GUID,
                    Date,
                    Severity,
                    Text,
                    DateCreated,
                    PreviwURL,
                    EventType,
                    EventTypeDescription,
                    BreachedCompanies,
                    DependentCompanies,
                    Companyname,
                    CompanyGUID
    );
    union isfuzzy=true
        (
            LocalData
        ),
        (
            // 3.0.x classic table in the old workspace (HTTP Data Collector API, suffixed columns)
            workspace('413d4385-18c4-4f38-bfa4-266196b82b38').BitsightBreaches_data_CL
            | extend
                    EventVendor = "BitSight",
                    EventProduct = "Breaches",
                    GUID = tostring(column_ifexists('guid_g','')),
                    Date = todatetime(column_ifexists('date_s','')),
                    Severity = todouble(column_ifexists('Severity','')),
                    Text = tostring(column_ifexists('text_s','')),
                    DateCreated = todatetime(column_ifexists('date_created_s','')),
                    PreviwURL = tostring(column_ifexists('preview_url_s','')),
                    EventType = tostring(column_ifexists('event_type_s','')),
                    EventTypeDescription = tostring(column_ifexists('event_type_description_s','')),
                    BreachedCompanies = todynamic(column_ifexists('breached_companies_s','')),
                    DependentCompanies = todynamic(column_ifexists('dependent_companies_s','')),
                    Companyname = tostring(column_ifexists('company_name_s','')),
                    CompanyGUID = tostring(column_ifexists('company_guid_g',''))
            | where strcat(GUID,'|',CompanyGUID) !in (toscalar(LocalData | summarize make_set(strcat(GUID,'|',CompanyGUID))))
            | project
                    TimeGenerated,
                    EventVendor,
                    EventProduct,
                    GUID,
                    Date,
                    Severity,
                    Text,
                    DateCreated,
                    PreviwURL,
                    EventType,
                    EventTypeDescription,
                    BreachedCompanies,
                    DependentCompanies,
                    Companyname,
                    CompanyGUID
        ),
        (
            BitSightBreaches_CL
            | summarize arg_max(TimeGenerated, *) by Guid, CompanyGuid
            | extend
                    EventVendor = "BitSight",
                    EventProduct = "Breaches"
            | project
                    TimeGenerated,
                    EventVendor,
                    EventProduct,
                    Guid,
                    CompanyName,
                    CompanyGuid,
                    BreachDate,
                    DateCreated,
                    Text,
                    PreviewUrl,
                    EventType,
                    EventTypeDescription,
                    Severity,
                    BreachedCompanies,
                    DependentCompanies,
                    ConnectorName
        )