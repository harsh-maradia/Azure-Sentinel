id: 39844fcb-d451-4050-ae41-23c8f27b611c
Function:
  Title: Parser for BitSightFindingsSummary
  Version: '1.2.0'
  LastUpdated: '2026-11-02'
Category: Microsoft Sentinel Parser
FunctionName: BitSightFindingsSummary
FunctionAlias: BitSightFindingsSummary
FunctionQuery: |
    let LocalData = (
        BitsightFindings_summary_CL
        | extend
                    EventVendor = "BitSight",
                    EventProduct = "FindingsSummary",
                    Company = tostring(column_ifexists('Company', '')),
                    Confidence = tostring(column_ifexists('confidence', '')),
                    EndDate = todatetime(column_ifexists('end_date', '')),
                    EventCount = todouble(column_ifexists('event_count', '')),
                    FirstSeen = todatetime(column_ifexists('first_seen', '')),
                    HostCount = todouble(column_ifexists('host_count', '')),
                    Id = tostring(column_ifexists('id', '')),
                    Name = tostring(column_ifexists('name', '')),
                    Severity = tostring(column_ifexists('severity', '')),
                    StartDate = todatetime(column_ifexists('start_date', '')),
                    Description = tostring(column_ifexists('description', ''))
        | project
                    TimeGenerated,
                    EventVendor,
                    EventProduct,
                    Company,
                    Confidence,
                    EndDate,
                    EventCount,
                    FirstSeen,
                    HostCount,
                    Id,
                    Name,
                    Severity,
                    StartDate,
                    Description
    );
    union isfuzzy=true
        (
            LocalData
        ),
        (
            // 3.0.x classic table in the old workspace (HTTP Data Collector API, suffixed columns)
            workspace('413d4385-18c4-4f38-bfa4-266196b82b38').BitsightFindings_summary_CL
            | extend
                    EventVendor = "BitSight",
                    EventProduct = "FindingsSummary",
                    Company = tostring(column_ifexists('Company_s','')),
                    Confidence = tostring(column_ifexists('confidence_s','')),
                    EndDate = todatetime(column_ifexists('end_date_s','')),
                    EventCount = todouble(column_ifexists('event_count_d','')),
                    FirstSeen = todatetime(column_ifexists('first_seen_s','')),
                    HostCount = todouble(column_ifexists('host_count_d','')),
                    Id = tostring(column_ifexists('id_s','')),
                    Name = tostring(column_ifexists('name_s','')),
                    Severity = tostring(column_ifexists('severity_s','')),
                    StartDate = todatetime(column_ifexists('start_date_s','')),
                    Description = tostring(column_ifexists('description_s',''))
            | where strcat(Company,'|',Id) !in (toscalar(LocalData | summarize make_set(strcat(Company,'|',Id))))
            | project
                    TimeGenerated,
                    EventVendor,
                    EventProduct,
                    Company,
                    Confidence,
                    EndDate,
                    EventCount,
                    FirstSeen,
                    HostCount,
                    Id,
                    Name,
                    Severity,
                    StartDate,
                    Description
        ),
        (
            BitSightFindingsSummary_CL
            | summarize arg_max(TimeGenerated, *) by CompanyGuid, StartDate, EndDate
            | mv-expand StatEntry = Stats
            | extend
                    EventVendor = "BitSight",
                    EventProduct = "FindingsSummary",
                    StatName = tostring(StatEntry["name"]),
                    StatId = tostring(StatEntry["id"]),
                    Confidence = tostring(StatEntry["confidence"]),
                    EventCount = toint(StatEntry["event_count"]),
                    HostCount = toint(StatEntry["host_count"]),
                    FirstSeen = tostring(StatEntry["first_seen"])
            | join kind=leftouter (
                BitsightVulnerabilitiesFindingsSummary_CL
                | summarize arg_max(TimeGenerated, *) by DisplayName
                | project DisplayName, VulnSeverity = Severity, VulnDescription = Description
            ) on $left.StatName == $right.DisplayName
            | project
                    TimeGenerated,
                    EventVendor,
                    EventProduct,
                    CompanyName,
                    CompanyGuid,
                    StartDate,
                    EndDate,
                    StatName,
                    StatId,
                    Confidence,
                    EventCount,
                    HostCount,
                    FirstSeen,
                    VulnSeverity,
                    VulnDescription,
                    ConnectorName
        )